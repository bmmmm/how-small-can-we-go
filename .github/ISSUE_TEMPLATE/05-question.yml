name: Question
description: Ask about the rules, a task's behavior, or whether something is intended
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check [README.md](https://github.com/bmmmm/how-small-can-we-go#readme),
        [SPEC.md](https://github.com/bmmmm/how-small-can-we-go/blob/main/SPEC.md),
        and [AGENTS.md](https://github.com/bmmmm/how-small-can-we-go/blob/main/AGENTS.md)
        first. If the answer turns out to be "that's a gap in the spec" or
        "that's a bug," we'll turn this into a proper report — don't worry
        about picking the wrong form.

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command or steps that led here, if any
      placeholder: "./arena check entries/semver-range-check --no-sandbox"

  - type: textarea
    id: output
    attributes:
      label: Output or behaviour you're asking about
      render: text
