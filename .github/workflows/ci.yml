# CI for the arena tool itself. Action majors verified 2026-08 via
# `gh api repos/<owner>/<action>/releases/latest`.
name: ci

on:
  push:
    branches: [main]
    paths: ['tool/**', 'scripts/smoke-test.sh', '.github/workflows/ci.yml']
  pull_request:
    paths: ['tool/**', 'scripts/smoke-test.sh', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      # The real-world smoke test: drives the built binary through the
      # actual no-network docker sandbox (ubuntu runners have docker) and
      # the gaming-resistance probes. This is the one place the real
      # sandbox path is exercised — unit tests fake it.
      - name: smoke test
        working-directory: .
        run: ./scripts/smoke-test.sh
