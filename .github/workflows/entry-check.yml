# Gates entry PRs: conformance in a no-network sandbox + the challenger
# rule (strictly smaller surface than the champion). Case PRs get an
# informational impact run. Action majors verified 2026-08 via
# `gh api repos/<owner>/<action>/releases/latest`.
#
# This workflow executes untrusted PR code and its own file comes from
# the PR head, so everything it produces — including the result artifact
# — is attacker-controlled data. It therefore holds no write scopes. The
# `entry-check-result` artifact is consumed by entry-close.yml, which
# runs from the default branch and validates every field before use.
name: entry-check

on:
  pull_request:
    paths:
      - 'entries/**'
      - 'tasks/**'
      - 'languages.json'

permissions:
  contents: read

concurrency:
  group: entry-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Build arena
        run: cd tool && go build -o "$RUNNER_TEMP/arena" .

      - name: Check changed entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          arena="$RUNNER_TEMP/arena"
          tsv="$RUNNER_TEMP/entries.tsv"
          : > "$tsv"
          summary() { echo "$@" >> "$GITHUB_STEP_SUMMARY"; }
          # Verdicts for the result artifact — mirrors the summary lines,
          # never influences the gate below.
          record() { printf '%s\t%s\t%s\t%s\n' "$1" "$2" "${3-}" "${4-}" >> "$tsv"; }
          # --no-renames: without it git folds "delete entries/a/x + add
          # entries/a/y with identical content" into a single R100 line,
          # the old path never surfaces, and the gate-3 removal check
          # below is evadable by renaming a niche directory.
          mapfile -t dirs < <(git diff --no-renames --name-only "$BASE_SHA"...HEAD -- entries/ | cut -d/ -f1-3 | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            summary "No entry changes."
            : > "$RUNNER_TEMP/check-complete"
            exit 0
          fi
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          fail=0
          for d in "${dirs[@]}"; do
            summary "## $d"
            if [ ! -d "$d" ]; then
              summary "- ❌ entry removed — entries leave the board by being beaten, not deleted (SPEC.md, gate 3)"
              record "$d" removed
              fail=1
              continue
            fi
            if "$arena" check "$d"; then
              summary "- ✅ conformance: all cases pass"
            else
              summary "- ❌ conformance failed — the job log shows the failing case and why"
              record "$d" conformance-fail
              fail=1
              continue
            fi
            new=$("$arena" surface "$d")
            if [ -d "$RUNNER_TEMP/base/$d" ]; then
              old=$(cd "$RUNNER_TEMP/base" && "$arena" surface "$d")
              if [ "$new" -lt "$old" ]; then
                summary "- ✅ surface: $new < $old — champion beaten"
                record "$d" beats-champion "$new" "$old"
              elif (cd "$RUNNER_TEMP/base" && "$arena" check "$d"); then
                summary "- ❌ surface: $new, champion: $old — a challenger must be strictly smaller (SPEC.md, gate 1)"
                record "$d" not-improving "$new" "$old"
                fail=1
              else
                summary "- ✅ surface: $new — champion was failing, the niche was open"
                record "$d" open-niche "$new" "$old"
              fi
            else
              summary "- ✅ surface: $new — new niche"
              record "$d" new-niche "$new"
            fi
          done
          : > "$RUNNER_TEMP/check-complete"
          exit "$fail"

      - name: Case impact (informational)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          arena="$RUNNER_TEMP/arena"
          mapfile -t tasks < <(git diff --name-only "$BASE_SHA"...HEAD -- tasks/ | cut -d/ -f1-2 | sort -u)
          [ "${#tasks[@]}" -eq 0 ] && exit 0
          {
            echo "## Case impact"
            echo "A new case is accepted when it breaks a current entry or closes a documented spec gap (SPEC.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          for t in "${tasks[@]}"; do
            name=$(basename "$t")
            for e in entries/"$name"/*/; do
              [ -d "$e" ] || continue
              e="${e%/}"
              if "$arena" check "$e"; then
                echo "- \`$e\`: still passing" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$e\`: **breaks** — this case discriminates" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          exit 0

      # Everything below is reporting only: both steps are
      # continue-on-error so a hiccup here can never flip the gate above.
      - name: Emit result
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$RUNNER_TEMP/entry-check-result"
          tsv="$RUNNER_TEMP/entries.tsv"
          mkdir -p "$out"
          [ -f "$tsv" ] || : > "$tsv"
          # A PR that touches anything outside entries/ — cases, specs,
          # languages.json, the tool, the workflows — is never a plain
          # challenger; entry-close leaves those to a human. --no-renames
          # so a file renamed into entries/ still counts as outside.
          touched_other=false
          if [ -n "$(git diff --no-renames --name-only "$BASE_SHA"...HEAD -- . ':(exclude)entries/')" ]; then
            touched_other=true
          fi
          if [ -f "$RUNNER_TEMP/check-complete" ]; then
            class=$(awk -F'\t' '
              $2 == "removed"          { removed = 1 }
              $2 == "conformance-fail" { failing = 1 }
              $2 == "not-improving"    { bigger = 1 }
              END {
                if (removed)   print "entry-removed";
                else if (failing) print "conformance-fail";
                else if (bigger)  print "not-improving";
                else if (NR > 0)  print "pass";
                else              print "no-entry-changes";
              }' "$tsv")
          else
            # The gate step never reached its end (build broke, runner
            # died, …) — no verdict, so nothing downstream may act.
            class=error
          fi
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg head "$HEAD_SHA" \
            --arg class "$class" \
            --argjson other "$touched_other" \
            --rawfile tsv "$tsv" \
            '{
               schema: "entry-check-result/1",
               pr: $pr,
               head_sha: $head,
               class: $class,
               touched_other: $other,
               entries: ($tsv | split("\n") | map(select(length > 0)) | map(split("\t")) | map(
                 { path: (.[0] // ""), status: (.[1] // "") }
                 + (.[2] // "" | if . == "" then {} else { surface: (tonumber? // .) } end)
                 + (.[3] // "" | if . == "" then {} else { champion: (tonumber? // .) } end)
               ))
             }' > "$out/result.json"
          cat "$out/result.json"

      - name: Upload result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: entry-check-result
          path: ${{ runner.temp }}/entry-check-result/result.json
          if-no-files-found: ignore
          retention-days: 1
