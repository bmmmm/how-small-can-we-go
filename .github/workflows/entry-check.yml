# Gates entry PRs: conformance in a no-network sandbox + the challenger
# rule (strictly better trust score than the champion: fewer third-party
# bytes, or equal bytes and fewer hazards). Case PRs get an informational
# impact run. Action majors verified 2026-08 via
# `gh api repos/<owner>/<action>/releases/latest`.
#
# This workflow executes untrusted PR code and its own file comes from
# the PR head, so everything it produces — including the result artifact
# — is attacker-controlled data. It therefore holds no write scopes. The
# `entry-check-result` artifact is consumed by entry-close.yml, which
# runs from the default branch and validates every field before use.
name: entry-check

# Also runs on branch pushes and manual dispatch so anyone can outsource
# the sandbox check to CI without opening a PR (push a branch — a fork
# works — or `gh workflow run entry-check --ref <branch>`). Only PR runs
# emit the result artifact; the close bot ignores everything else.
on:
  pull_request:
    paths:
      - 'entries/**'
      - 'tasks/**'
      - 'languages.json'
  push:
    branches-ignore: [main]
    paths:
      - 'entries/**'
      - 'tasks/**'
      - 'languages.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entry-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Build arena
        run: cd tool && go build -o "$RUNNER_TEMP/arena" .

      - name: Check changed entries
        env:
          # Base at event time. If main advanced since, the champion
          # compared against may be stale — safe, because a champion's
          # score only ever improves and the score order is total:
          # not-improving vs the old one implies not-improving vs the
          # new one.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # push/dispatch runs have no PR context — compare against the
          # fork point instead.
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git merge-base origin/main HEAD)
          fi
          arena="$RUNNER_TEMP/arena"
          tsv="$RUNNER_TEMP/entries.tsv"
          : > "$tsv"
          summary() { echo "$@" >> "$GITHUB_STEP_SUMMARY"; }
          # Verdicts for the result artifact — mirrors the summary lines,
          # never influences the gate below. Columns: path, status,
          # vendored, hazards, champion vendored, champion hazards.
          record() { printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "${3-}" "${4-}" "${5-}" "${6-}" >> "$tsv"; }
          # Lexicographic score order: fewer third-party bytes, or equal
          # bytes and fewer hazards. Equal defends the champion.
          better() { [ "$1" -lt "$3" ] || { [ "$1" -eq "$3" ] && [ "$2" -lt "$4" ]; }; }
          # --no-renames: without it git folds "delete entries/a/x + add
          # entries/b/x with identical content" into a single R100 line,
          # the old path never surfaces, and the gate-3 removal check
          # below is evadable by renaming a niche directory.
          mapfile -t dirs < <(git diff --no-renames --name-only "$BASE_SHA"...HEAD -- entries/ | cut -d/ -f1-2 | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            summary "No entry changes."
            : > "$RUNNER_TEMP/check-complete"
            exit 0
          fi
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          fail=0
          for d in "${dirs[@]}"; do
            summary "## $d"
            if [ ! -d "$d" ]; then
              summary "- ❌ entry removed — entries leave the board by being beaten, not deleted (SPEC.md, gate 3)"
              record "$d" removed
              fail=1
              continue
            fi
            # arena exit codes: 0 pass, 1 fail, 3 infra (sandbox broke,
            # no verdict). infra must never read as the entry failing —
            # that distinction is what keeps the close bot honest.
            rc=0
            "$arena" check "$d" || rc=$?
            if [ "$rc" -eq 0 ]; then
              summary "- ✅ conformance: all cases pass"
            elif [ "$rc" -eq 3 ]; then
              summary "- ⚠️ infra failure — the sandbox broke, not the entry; re-run this job"
              record "$d" infra-error
              fail=1
              continue
            else
              summary "- ❌ conformance or entry validation failed — the job log names the failing case or the manifest/file violation"
              record "$d" conformance-fail
              fail=1
              continue
            fi
            # A score that failed or printed nothing is no verdict —
            # without this guard an empty read would fall through to
            # the not-improving branch and auto-close on a measurement
            # that never happened.
            if ! score_out=$("$arena" score "$d") || ! read -r new_v new_h <<< "$score_out" || [ -z "$new_h" ]; then
              summary "- ⚠️ scoring failed — no verdict; see the job log"
              record "$d" infra-error
              fail=1
              continue
            fi
            if [ -d "$RUNNER_TEMP/base/$d" ]; then
              # Scored from the PR checkout on purpose: both sides are
              # scored under the PR's languages.json, so a PR touching
              # the hazard config cannot compare apples to oranges.
              if ! score_out=$("$arena" score "$RUNNER_TEMP/base/$d") || ! read -r old_v old_h <<< "$score_out" || [ -z "$old_h" ]; then
                summary "- ⚠️ scoring the champion failed — no verdict; see the job log"
                record "$d" infra-error
                fail=1
                continue
              fi
              if better "$new_v" "$new_h" "$old_v" "$old_h"; then
                summary "- ✅ trust score: $new_v bytes / $new_h hazards beats $old_v / $old_h — champion beaten"
                record "$d" beats-champion "$new_v" "$new_h" "$old_v" "$old_h"
              else
                base_rc=0
                (cd "$RUNNER_TEMP/base" && "$arena" check "$d") || base_rc=$?
                if [ "$base_rc" -eq 3 ]; then
                  summary "- ⚠️ infra failure while re-checking the champion — no verdict; re-run this job"
                  record "$d" infra-error
                  fail=1
                elif [ "$base_rc" -eq 0 ]; then
                  summary "- ❌ trust score: $new_v bytes / $new_h hazards, champion: $old_v / $old_h — a challenger must be strictly better: fewer third-party bytes, or equal bytes and fewer hazards (SPEC.md, gate 1)"
                  record "$d" not-improving "$new_v" "$new_h" "$old_v" "$old_h"
                  fail=1
                else
                  summary "- ✅ trust score: $new_v bytes / $new_h hazards — champion was failing, the niche was open"
                  record "$d" open-niche "$new_v" "$new_h" "$old_v" "$old_h"
                fi
              fi
            else
              summary "- ✅ trust score: $new_v bytes / $new_h hazards — new niche"
              record "$d" new-niche "$new_v" "$new_h"
            fi
          done
          : > "$RUNNER_TEMP/check-complete"
          exit "$fail"

      - name: Case impact (informational)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git merge-base origin/main HEAD)
          fi
          arena="$RUNNER_TEMP/arena"
          mapfile -t tasks < <(git diff --no-renames --name-only "$BASE_SHA"...HEAD -- tasks/ | cut -d/ -f1-2 | sort -u)
          [ "${#tasks[@]}" -eq 0 ] && exit 0
          {
            echo "## Case impact"
            echo "A new case is accepted when it breaks the current champion or closes a documented spec gap (SPEC.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          for t in "${tasks[@]}"; do
            e="entries/$(basename "$t")"
            [ -d "$e" ] || continue
            rc=0
            "$arena" check "$e" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "- \`$e\`: still passing" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$rc" -eq 3 ]; then
              echo "- \`$e\`: ⚠️ infra failure — no verdict on this case's impact" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$e\`: **breaks** — this case discriminates" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0

      # Everything below is reporting only: both steps are
      # continue-on-error so a hiccup here can never flip the gate above.
      # PR-only — push/dispatch runs have no PR to bind the result to,
      # and entry-close only consumes pull_request runs anyway.
      - name: Emit result
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$RUNNER_TEMP/entry-check-result"
          tsv="$RUNNER_TEMP/entries.tsv"
          mkdir -p "$out"
          [ -f "$tsv" ] || : > "$tsv"
          # A PR that touches anything outside entries/ — cases, specs,
          # languages.json, the tool, the workflows — is never a plain
          # challenger; entry-close leaves those to a human. --no-renames
          # so a file renamed into entries/ still counts as outside.
          touched_other=false
          if [ -n "$(git diff --no-renames --name-only "$BASE_SHA"...HEAD -- . ':(exclude)entries/')" ]; then
            touched_other=true
          fi
          if [ -f "$RUNNER_TEMP/check-complete" ]; then
            # Precedence: removed first (always a maintainer call),
            # then infra — one entry without a verdict poisons the
            # whole run for auto-closing purposes — then the failure
            # classes.
            class=$(awk -F'\t' '
              $2 == "removed"          { removed = 1 }
              $2 == "infra-error"      { infra = 1 }
              $2 == "conformance-fail" { failing = 1 }
              $2 == "not-improving"    { bigger = 1 }
              END {
                if (removed)   print "entry-removed";
                else if (infra)   print "infra-error";
                else if (failing) print "conformance-fail";
                else if (bigger)  print "not-improving";
                else if (NR > 0)  print "pass";
                else              print "no-entry-changes";
              }' "$tsv")
          else
            # The gate step never reached its end (build broke, runner
            # died, …) — no verdict, so nothing downstream may act.
            class=error
          fi
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg head "$HEAD_SHA" \
            --arg class "$class" \
            --argjson other "$touched_other" \
            --rawfile tsv "$tsv" \
            '{
               schema: "entry-check-result/3",
               pr: $pr,
               head_sha: $head,
               class: $class,
               touched_other: $other,
               entries: ($tsv | split("\n") | map(select(length > 0)) | map(split("\t")) | map(
                 { path: (.[0] // ""), status: (.[1] // "") }
                 + (.[2] // "" | if . == "" then {} else { vendored: tonumber } end)
                 + (.[3] // "" | if . == "" then {} else { hazards: tonumber } end)
                 + (.[4] // "" | if . == "" then {} else { champion_vendored: tonumber } end)
                 + (.[5] // "" | if . == "" then {} else { champion_hazards: tonumber } end)
               ))
             }' > "$out/result.json"
          cat "$out/result.json"

      - name: Upload result
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: entry-check-result
          path: ${{ runner.temp }}/entry-check-result/result.json
          if-no-files-found: ignore
          retention-days: 1
